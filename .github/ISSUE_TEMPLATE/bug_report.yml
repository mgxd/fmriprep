name: Bug Report
description: File a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What command did you use?
      description: This helps us replicate the problem. This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: What version of *fMRIPrep* are you running?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: How are you running *fMRIPrep*?
      options:
        - Docker
        - Singularity
        - Local installation ("bare-metal")
        - Other
    validations:
      required: true
  - type: dropdown
    id: bids-valid
    attributes:
      label: Have you checked that your inputs are BIDS valid?
      options:
        - Yes
        - No
    validations:
      required: true
  - type: dropdown
    id: reuse
    attributes:
      label: Are you reusing previously computed results (e.g., FreeSurfer, Anatomical derivatives, work directory of previous run)?
      options:
        - Yes
        - No
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. Can you find some traces of the error reported in the visual report (at the bottom) or in *crashfiles*? This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: markdown
    attributes:
      value: |
        Thank you for filling out this issue form! If you would like to include any further information, such as any visual reports,
        please include them below. Alternatively, you can privately share with us at <nipreps@gmail.com>.
        Reports do not contain data usable with personal identification or other research purposes.
  - type: textarea
    id: addinfo
    attributes:
      label: Add any additional information or context about the problem here.
